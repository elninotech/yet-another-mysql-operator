apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: Cg==
    service:
      name: webhook-service
      namespace: system
      path: /mutate-database-elnino-tech-v1alpha1-mysql
      port: 443
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: mmysql.database.elnino.tech
  rules:
  - apiGroups:
    - database.elnino.tech
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - mysqls
  sideEffects: None
  timeoutSeconds: 10
