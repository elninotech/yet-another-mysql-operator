apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "yamo.fullname" . }}-mysql-editor-role
  labels:
  {{- include "yamo.labels" . | nindent 4 }}
rules:
- apiGroups:
  - database.elnino.tech
  resources:
  - mysqls
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - database.elnino.tech
  resources:
  - mysqls/status
  verbs:
  - get
