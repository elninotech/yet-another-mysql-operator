apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "yamo.fullname" . }}-manager-role
  labels:
  {{- include "yamo.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - persistentvolumeclaims
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps/status
  - persistentvolumeclaims/status
  - pods/status
  - secrets/status
  - services/status
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets/status
  verbs:
  - get
- apiGroups:
  - database.elnino.tech
  resources:
  - mysqls
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - database.elnino.tech
  resources:
  - mysqls/finalizers
  verbs:
  - update
- apiGroups:
  - database.elnino.tech
  resources:
  - mysqls/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "yamo.fullname" . }}-manager-rolebinding
  labels:
  {{- include "yamo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: '{{ include "yamo.fullname" . }}-manager-role'
subjects:
- kind: ServiceAccount
  name: '{{ include "yamo.serviceAccountName" . }}'
  namespace: '{{ .Release.Namespace }}'
